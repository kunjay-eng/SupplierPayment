<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Supplier Payment</title>
<meta name="theme-color" content="#14213D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Supplier Pay">
<style>
html,body{margin:0;height:100%;background:#14213D;color:#fff;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif}
#wrap{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;background:#14213D}
iframe{flex:1;width:100%;border:0;background:#F8F9FA}
#msg{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:12px}
#msg img{width:84px;height:84px;border-radius:20px}
#msg p{margin:0;line-height:1.5;max-width:340px}
button,a.b{border:0;border-radius:10px;padding:11px 18px;font:inherit;font-weight:700;background:#0F9D6B;color:#fff;text-decoration:none;display:inline-block}
button.g{background:transparent;border:2px solid #fff}
#hint{position:absolute;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 70px);background:#FFF4DA;color:#5a4300;border-radius:10px;padding:9px 12px;font-size:13px;display:none;align-items:center;gap:8px;box-shadow:0 2px 10px #0006}
#hint button{padding:6px 10px;font-size:12.5px;background:#E8A317;color:#fff;white-space:nowrap}
#hint span{flex:1}
#hint i{font-style:normal;padding:4px 8px;cursor:pointer}
</style>
</head>
<body>
<div id="wrap">
  <div id="msg"><img src="icons/icon-192.png" alt=""><p id="mt"></p><div id="ma"></div></div>
  <div id="hint"><span>ไม่เห็นหน้าระบบ? ลองเปิดแบบเต็มหน้าจอ</span><button id="hb">เปิดตรง</button><i id="hx">✕</i></div>
</div>
<script src="config.js"></script>
<script>
(function () {
  var C = window.APP_CONFIG || {}, $ = function (id) { return document.getElementById(id); };
  var url = String(C.APPS_SCRIPT_URL || '').trim();
  function show(text, html) { $('msg').style.display = 'flex'; $('mt').textContent = text; $('ma').innerHTML = html || ''; }
  function okUrl(u) { return /^https:\/\/script\.google\.com\/(macros\/s\/|a\/)/.test(u); }
  if (!url) { show('ยังไม่ได้ตั้งค่าลิงก์ระบบ — แก้ไฟล์ config.js ใส่ APPS_SCRIPT_URL', '<a class="b" href="index.html">กลับหน้าติดตั้ง</a>'); return; }
  if (!okUrl(url)) { show('ลิงก์ใน config.js ไม่ถูกต้อง (ต้องขึ้นต้นด้วย https://script.google.com/macros/s/...)', '<a class="b" href="index.html">กลับหน้าติดตั้ง</a>'); return; }

  var q = new URLSearchParams(location.search), mode = q.get('mode');
  try { if (mode === 'iframe' || mode === 'redirect') localStorage.setItem('wrapMode', mode); else mode = localStorage.getItem('wrapMode'); } catch (e) {}
  mode = mode || C.MODE || 'iframe';

  if (!navigator.onLine) {
    show('ไม่มีอินเทอร์เน็ต — ระบบต้องออนไลน์เพื่อดึงข้อมูลการเงินล่าสุด', '<button id="rt">ลองใหม่</button>');
    $('rt').onclick = function () { location.reload(); };
    addEventListener('online', function () { location.reload(); });
    return;
  }
  if (mode === 'redirect') { location.replace(url); return; }

  var f = document.createElement('iframe');
  f.src = url; f.title = C.APP_NAME || 'Supplier Payment';
  f.allow = 'clipboard-write; web-share; fullscreen';
  $('wrap').insertBefore(f, $('msg'));
  var hint = $('hint');
  setTimeout(function () { hint.style.display = 'flex'; }, 6000);
  setTimeout(function () { hint.style.display = 'none'; }, 20000);
  $('hx').onclick = function () { hint.style.display = 'none'; };
  $('hb').onclick = function () { try { localStorage.setItem('wrapMode', 'redirect'); } catch (e) {} location.replace(url); };
})();
</script>
</body>
</html>
